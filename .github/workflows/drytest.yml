name: Dry test — the brain reviews the model
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run id whose artifact to download into ./artifact (blank = none)"
        default: ""
      script:
        description: "The script to run (tools/...)"
        default: "tools/drytest_review.py"
      company:
        description: "First argument to the script (company dir or artifact dir)"
        default: "companies/CX"
      args:
        description: "Further arguments to the script"
        default: ""
jobs:
  drytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      PYTHONUNBUFFERED: "1"
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-5.6-luna' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - if: inputs.run_id != ''
        run: gh run download "${{ inputs.run_id }}" -D artifact
      - run: python "${{ inputs.script }}" "${{ inputs.company }}" ${{ inputs.args }} 2>&1 | tee drytest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drytest
          path: |
            drytest.txt
            drytest_out
