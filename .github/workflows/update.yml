name: Model update

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company folder (under companies/)"
        default: "CLP"
        required: true
      period:
        description: "Fiscal period (e.g. FY25, 1H26)"
        default: "FY25"
        required: true
      model:
        description: "Optional model override (else repo variable)"
        default: ""
        required: false
      action:
        description: "pipeline (THE agent — default), updater (previous gen), legacy behind explicit name"
        default: "pipeline"
        required: false
      prior_period:
        description: "Prior period for the learner leg of chain/learn (e.g. FY24)"
        default: "FY24"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ inputs.model || vars.LLM_MODEL || 'gpt-5.6-luna' }}
      REVIEWER_MODEL: ${{ inputs.model || vars.REVIEWER_MODEL || 'gpt-5.6-luna' }}
      ESCALATION_MODEL: ${{ vars.ESCALATION_MODEL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # NO cross-run caching: every run starts cold (fresh VM, fresh checkout,
      # fresh extraction) so no run inherits context from a previous one.
      - name: Run model update / learner
        run: |
          if [ "${{ inputs.action || 'pipeline' }}" = "pipeline" ]; then
            # THE CURRENT AGENT (clean rebuild, law era — delivered DFE FY25
            # run 19 with zero check failures all years). Exit 0 = DELIVERED,
            # 1 = GATE REFUSED (quarantined workbook + replay evidence are
            # still committed and uploaded), 2 = usage/env error.
            YY=$(echo "${{ inputs.period }}" | grep -o '[0-9][0-9]$')
            python -m pipeline.cli "companies/${{ inputs.company }}" \
              "${{ inputs.period }}" "20${YY}" --budget=90
          elif [ "${{ inputs.action }}" = "readtest" ]; then
            # THE READING TEST (owner 2026-09-09): not the agent — an experiment.
            # Luna reads the whole disclosure in one view and answers the
            # model's headline rows with page references; scored against
            # code's own ties. Output: companies/<CO>/updates/read_test_<PERIOD>.{json,md}
            YY=$(echo "${{ inputs.period }}" | grep -o '[0-9][0-9]$')
            python tools/read_test.py "companies/${{ inputs.company }}" \
              "${{ inputs.period }}" "20${YY}"
          elif [ "${{ inputs.action }}" = "updater" ]; then
            # THE NEW AGENT (objectives rework 2026-08-17): one loop owns the
            # run, always delivers, 4 Police laws. Exit 3 = PAUSED for the
            # analyst (restatement question in updates/ — answer and re-run);
            # surfaced as success-with-notice, not a failure.
            YY=$(echo "${{ inputs.period }}" | grep -o '[0-9][0-9]$')
            set +e
            python -m updater.cli "companies/${{ inputs.company }}" \
              "${{ inputs.period }}" "20${YY}"
            code=$?
            set -e
            if [ "$code" = "3" ]; then
              echo "::notice::PAUSED for analyst (restatement question uploaded in artifacts under updates/)"
            elif [ "$code" != "0" ]; then
              exit "$code"
            fi
          elif [ "${{ inputs.action }}" = "legacy-chain-i-am-sure" ]; then
            # the RETIRED stack, kept only behind an unmistakable explicit
            # value (AUDIT_2026-08-18: it ran silently on a defaulted input
            # and burned two run-hours)
            python run.py learn "companies/${{ inputs.company }}" "${{ inputs.prior_period || 'FY24' }}"
            python run.py update "companies/${{ inputs.company }}" "${{ inputs.period }}"
          else
            echo "::error::action '${{ inputs.action }}' is RETIRED — the"
            echo "::error::updater is the agent (AUDIT_2026-08-18_dispatch.md)."
            exit 64
          fi
      - name: Persist results (model, replay evidence, case law)
        if: ${{ always() && (inputs.action == 'pipeline' || inputs.action == 'updater' || inputs.action == '') }}
        run: |
          git config user.name "model-update-agent"
          git config user.email "agent@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git add "companies/${{ inputs.company }}/model/" \
                  "companies/${{ inputs.company }}/model-archive/" \
                  "companies/${{ inputs.company }}/replay/" \
                  "companies/${{ inputs.company }}/updates/" 2>/dev/null || true
          git commit -m "run results: ${{ inputs.company }} ${{ inputs.period }} (${{ inputs.action || 'pipeline' }})" || echo "no new results"
          git push || echo "push skipped"
      - name: Persist learner/discover/digest outputs
        if: ${{ inputs.action == 'learn' || inputs.action == 'discover' || inputs.action == 'digest' }}
        run: |
          git config user.name "model-update-agent"
          git config user.email "agent@users.noreply.github.com"
          git add "companies/${{ inputs.company }}/model/" "companies/${{ inputs.company }}/spec.yaml" \
                  "companies/${{ inputs.company }}/disclosures/${{ inputs.period }}/digest.json" || true
          git commit -m "${{ inputs.action }}: persisted output for ${{ inputs.company }} ${{ inputs.period }}" || echo "no changes to commit"
          git push
      - name: Upload results (model + reports + staging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.company }}-${{ inputs.period }}-update
          path: |
            companies/${{ inputs.company }}/model/
            companies/${{ inputs.company }}/model-archive/
            companies/${{ inputs.company }}/updates/
            companies/${{ inputs.company }}/replay/
          if-no-files-found: warn
