name: Model update

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Company folder (under companies/)"
        default: "CLP"
        required: true
      period:
        description: "Fiscal period (e.g. FY25, 1H26)"
        default: "FY25"
        required: true
      model:
        description: "Optional model override (else repo variable)"
        default: ""
        required: false
      action:
        description: "chain (learn then update in one go), update, or learn"
        default: "chain"
        required: false
      prior_period:
        description: "Prior period for the learner leg of chain/learn (e.g. FY24)"
        default: "FY24"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ inputs.model || vars.LLM_MODEL || 'gpt-5.6-luna' }}
      REVIEWER_MODEL: ${{ inputs.model || vars.REVIEWER_MODEL || 'gpt-5.6-luna' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # NO cross-run caching: every run starts cold (fresh VM, fresh checkout,
      # fresh extraction) so no run inherits context from a previous one.
      - name: Run model update / learner
        run: |
          if [ "${{ inputs.action || 'chain' }}" = "chain" ]; then
            # one go: learner (skips itself if the memory tab already exists),
            # then the objective-driven update on the same working copy
            python run.py learn "companies/${{ inputs.company }}" "${{ inputs.prior_period || 'FY24' }}"
            python run.py update "companies/${{ inputs.company }}" "${{ inputs.period }}"
          elif [ "${{ inputs.action }}" = "learn" ]; then
            python run.py learn "companies/${{ inputs.company }}" "${{ inputs.prior_period || 'FY24' }}"
          else
            python run.py "${{ inputs.action }}" "companies/${{ inputs.company }}" "${{ inputs.period }}"
          fi
      - name: Persist learner/discover outputs
        if: ${{ inputs.action == 'learn' || inputs.action == 'discover' }}
        run: |
          git config user.name "model-update-agent"
          git config user.email "agent@users.noreply.github.com"
          git add "companies/${{ inputs.company }}/model/" "companies/${{ inputs.company }}/spec.yaml" || true
          git commit -m "learner: _UPDATE_MAP memory tab for ${{ inputs.company }}" || echo "no changes to commit"
          git push
      - name: Upload results (model + reports + staging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.company }}-${{ inputs.period }}-update
          path: |
            companies/${{ inputs.company }}/model/
            companies/${{ inputs.company }}/model-archive/
            companies/${{ inputs.company }}/updates/
          if-no-files-found: warn
