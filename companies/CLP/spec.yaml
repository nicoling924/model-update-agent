roll_forward_bases:
- sheet: Driver
  cell: AI70
  what: NFA gross base
  re_anchor_rule: FA gross cost + ROU net + FiT adj from AR fixed-asset note
- sheet: Driver
  cell: AI71
  what: accumulated depreciation base
  re_anchor_rule: accumulated depreciation from AR fixed-asset note (negative)
calc_mode: manual
quirks:
- Final BS stores liabilities as POSITIVE numbers
- 'DCF is calculation-only; pre-existing #REF! at DCF row 130 and HK Sales rows 6/29
  historic columns — leave'
- Year headers are plain numbers (2025, never '2025A' text) — DCF reads them numerically
- India!AI60 deliberately references AF column — never re-pattern
- One-off gains at Final row 16 DO propagate to forecasts; hedging row 107 must NOT
  (reset AJ107 to 0)
aliases:
  revenue:
  - turnover
  - total revenue
  electricity sales:
  - sales of electricity
backout_rules:
- row_ref: Final!21
  components:
  - -finance costs
  - +finance income
- row_ref: Final!97
  components:
  - bs:perpetual capital securities
  - bs:other non-controlling interests
- row_ref: SOC Accounts!58
  method: prior-year value / prior-year group gas consumed TJ * current-year group
    gas consumed TJ (AR SoC statistics)
- row_ref: HK Sales!7
  method: = SoC total revenue - total electricity sales (2023 pattern)
analyst_rulings:
- 'Aus!AI2 / CN!AI2 FX: KEEP model''s stored assumption; never repoint to disclosed
  average'
- 'India avg FX row 3: analyst hand-set; India YE FX row 2: hand-set + red flag'
- 'SEA FX rows 2-3: carry prior year via formula (=prior col)'
- 'CN capacity bottom-up rows: 125/132/135 only; 128/136 carry prior year; 143/147
  stay 0'
- 'Driver!127 dividends-from-associates: map from the CF statement normally (a prior
  reference model held a transcription error on this line)'
- 'CF allocation: perpetual/NCI dividend terms in Final row 135; small adjustment
  plugs in row 124'
carried_flags:
- Aus!AI71:AI74 generation GWh (carried FY24 level)
- India!AI2 YE FX (hand-set, red-flag)
tie_out_anchors:
- name: balance check current actual
  sheet: Final
  cell: AI99
  expected: 0
  source: internal
- name: ROAFNA check
  sheet: ROAFNA
  cell: AI31
  expected: 0
  source: internal
analyst_fixes:
- sheet: ROAFNA
  cell: AH19
  value: =36+5487
  why: 'Known mis-built FY24 hardcode (MODEL_SPEC 5): SoC combined BS other assets
    = non-current 36 + current 5,487 (AR p260); zeroes the FY24 ROAFNA!AH31 check'
