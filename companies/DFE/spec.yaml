calc_mode: manual
quirks:
- type: forecast_columns_are_non_adjacent_to_visible_header_sample
  description: Model's visible header sample ends at O, but valuation formulas identify
    U:Z as FY2025-FY2030 forecast columns.
  evidence:
  - Model!O2
  - Fair Value - A!L4
  - Fair Value - A!P4
- type: mixed_sign_convention
  description: Expenses and some cash outflows are stored as negative values in Model,
    while balance-sheet liabilities are stored as positive values and summed into
    total liabilities and equity.
  evidence:
  - Model!B6
  - Model!B17
  - Model!B69
  - Model!B93
- type: source_sheet_multilingual
  description: Raw financials uses Chinese labels and has sparse/non-contiguous populated
    columns in later comparative data.
  evidence:
  - Raw financials!A4
  - Raw financials!A55
  - Raw financials!A183
- type: formula_cells_reference_other_sheets
  description: Model is extensively linked to Raw financials; Driver is linked to
    Model; valuation sheets are linked to Model.
  evidence:
  - Model!B4
  - Driver!E14
  - Fair Value - A!L4
- type: pre_existing_special_formula_cells
  description: Sensitvity contains Excel data-table formulas represented as openpyxl
    DataTableFormula objects.
  evidence:
  - Sensitvity!E6
  - Sensitvity!N6
- type: pre_existing_error_or_unsupported_formula_risk
  description: AH discount contains _xlfn.STDEV.P formulas, which may be unsupported
    in some calculation engines.
  evidence:
  - AH discount!R1
  - AH discount!D3
- type: header_and_label_typo
  description: The sheet is named Sensitvity rather than Sensitivity; preserve the
    existing sheet name and formulas.
  evidence:
  - Sensitvity!B4
  - Driver!U18
- type: check_rows_are_rounded
  description: Several balance checks use ROUND(...,0), so small sub-unit differences
    are intentionally suppressed.
  evidence:
  - Model!B95
  - Model!B135
  - Driver!E109
