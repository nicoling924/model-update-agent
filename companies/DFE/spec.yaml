quirks:
- issue: Forecast and historical headers are structurally different.
  evidence:
  - Model!B2 contains a plain numeric year
  - Raw financials!B2 contains text FY2006
  - Fair Value - H!L2 contains text 2025E
  risk: Never normalize or overwrite headers.
- issue: The Model uses non-adjacent and cross-sheet year references.
  evidence:
  - Driver!E14 = Model!P4
  - Driver!J95 = Model!U4/Model!T4*Driver!I95
  - Model!U102 references Model!T91 and Model!T99
- issue: Some schedules use sign-reversed presentation conventions.
  evidence:
  - Model!B6 = -'Raw financials'!B8
  - Model!B17 = -'Raw financials'!B13
  - Model!B23 = -'Raw financials'!B36
  - Model!B99 = B98-B47
  risk: Preserve signs and formulas; do not map by label alone.
- issue: Debt and liabilities are stored as positive balances in the balance sheet.
  evidence:
  - Model!A69 contains Short term borrowing
  - Model!A77 contains Long term borrowing and bonds payable
  - Model!A93 = B75+B82+B91
- issue: Sensitivity tables contain Excel data-table formula objects.
  evidence:
  - Sensitvity!E6
  - Sensitvity!N6
  - Sensitvity!E27
  risk: Do not overwrite or convert these cells during normal updates.
- issue: The sensitivity sheet name is misspelled as Sensitvity.
  evidence:
  - Driver!U18 references Sensitvity!J26
  - Driver!U73 references Sensitvity!A6
  risk: Preserve the exact sheet name in formulas.
- issue: There are sparse, auxiliary columns outside the principal year axis.
  evidence:
  - Model!AA19:AX19 contain auxiliary calculations
  - Driver!AB6:AD6 contain comparison data
  - Raw financials!AA114 contains a balance adjustment
- issue: The structural dump is truncated and does not show all year-header cells
    or all forecast rows.
  evidence:
  - Model!P2:Z2 are not fully shown
  - Raw financials!O2 onward is not fully shown
  - Model!T-column cell types are not consistently shown
  risk: Require a complete workbook inspection before editing the latest actual column.
- issue: Potential pre-existing unsupported formula/error constructs exist.
  evidence:
  - AH discount!R1 contains _xlfn.STDEV.P
  - Sensitvity!E6 contains an openpyxl DataTableFormula object
