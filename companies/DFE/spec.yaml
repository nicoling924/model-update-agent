sheets:
  Model:
    role: statements
    evidence:
    - Model!A3 contains P&L
    - Model!A46 contains Balance Sheet
    - Model!A104 contains Cash flow statement
  Raw financials:
    role: statements
    evidence:
    - Raw financials!A3 contains P&L
    - Raw financials!A53 contains Balance sheet
    - Raw financials!A183 contains CF statement
    note: Source/raw financial statement data; Model is the primary integrated statement
      and forecast sheet.
  Driver:
    role: drivers
    evidence:
    - Driver!A3 contains P&L drivers
    - Driver!A91 contains Balance Sheet driver
    - Driver!A127 contains Borrowing and interest expense
    - Driver!A141 contains Net working capital
  Sensitvity:
    role: valuation
    evidence:
    - Sensitvity!B4 contains Gas Turbine sensitivity analysis
    - Sensitvity!K4 contains Nuclear sensitivity analysis
    - Sensitvity!B5 contains Base case net income
    note: Calculation-only sensitivity sheet; do not edit during routine statement
      updates.
  Fair Value - H:
    role: valuation
    evidence:
    - Fair Value - H!A2 contains P/E multiple valuation
    - Fair Value - H!D2 contains Forecast returns and rating
    note: Calculation-only valuation sheet; do not edit.
  Fair Value - A:
    role: valuation
    evidence:
    - Fair Value - A!A2 contains P/E multiple valuation
    - Fair Value - A!D2 contains Forecast returns and rating
    note: Calculation-only valuation sheet; do not edit.
  Cons:
    role: untouched
    evidence:
    - Cons!A14 contains Consensus from Reuters
    - 'Cons!A20 contains Unit: Rmb mn'
    note: Consensus comparison sheet; preserve as provided.
  Appendix:
    role: untouched
    evidence:
    - Appendix!B2 contains Milestone
    - Appendix!E14 contains Management
    - Appendix!B23 contains Shareholding structure by Q125
  AH discount:
    role: untouched
    evidence:
    - AH discount!A2 contains Date
    - AH discount!B2 contains Dongfang H share discount to A share
    - AH discount!P1 contains A/H溢价率
    note: Historical market-data sheet; preserve as provided.
  VA-Disclaimer:
    role: untouched
    evidence:
    - VA-Disclaimer!A1 is the only populated structural location
