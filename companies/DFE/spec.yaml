statement_rows:
  primary_sheet: Model
  unit: Rmb m except per-share figures and ratios
  p_and_l:
    revenue:
      row: 4
      label: Revenue
      evidence: Model!A4
    d_and_a:
      rows:
        depreciation: 107
        amortization: 108
      labels:
      - Depreciation
      - Amortization
      evidence:
      - Model!A107
      - Model!A108
      note: Total D&A is the composition Model row 107 + Model row 108; no single
        total D&A row is shown.
    finance_cost_income:
      finance_gain_cost:
        row: 17
        label: Finance gain (cost)
        evidence: Model!A17
      investment_income:
        row: 18
        label: Investment income
        evidence: Model!A18
      composition_note: Model row 17 is linked as the negative of Raw financials finance
        expense, while Model row 18 is investment income.
    tax:
      row: 23
      label: Tax
      evidence: Model!A23
    net_profit:
      row: 25
      label: Profit after tax
      evidence: Model!A25
    attributable_profit:
      row: 28
      label: Reported net profit
      evidence: Model!A28
      tie: Model!A28 is Model row 25 plus Model row 26, where row 26 is minority interest.
    eps:
      basic:
        row: 35
        label: EPS - basic
        evidence: Model!A35
      diluted:
        row: 36
        label: EPS - diluted
        evidence: Model!A36
    dividends:
      cash_dividend:
        row: 38
        label: Dividend 现金分红
        evidence: Model!A38
      dps:
        row: 39
        label: DPS
        evidence: Model!A39
        tie: Model row 39 equals Model row 38 divided by Model row 42.
  balance_sheet:
    cash:
      row: 47
      label: Cash
      evidence: Model!A47
    assets:
      total_assets:
        row: 67
        label: Total Assets
        evidence: Model!A67
        tie: Model row 67 equals Model row 54 plus Model row 65.
    equity:
      shareholders_equity:
        row: 89
        label: Total shareholder's equity
        evidence: Model!A89
      total_equity:
        row: 91
        label: Total equity
        evidence: Model!A91
        tie: Model row 91 equals Model row 89 plus Model row 90.
    debt:
      total_debt:
        row: 98
        label: Total debt
        evidence: Model!A98
        tie: Model row 98 equals Model rows 69 + 73 + 77.
      debt_components:
      - row: 69
        label: Short term borrowing
        evidence: Model!A69
      - row: 73
        label: LT borrowing mature in 1 year
        evidence: Model!A73
      - row: 77
        label: Long term borrowing and bonds payable
        evidence: Model!A77
    liabilities_and_equity:
      row: 93
      label: Total liabilities and equity
      evidence: Model!A93
      tie: Model row 93 equals Model rows 75 + 82 + 91.
  cash_flow:
    section_row: 104
    operating_cash_flow:
      row: 114
      label: Operating cash flow
      evidence: Model!A114
    investing_cash_flow:
      row: 120
      label: Investing cash flow
      evidence: Model!A120
    financing_cash_flow:
      row: 127
      label: Financing cash flow
      evidence: Model!A127
    net_changes_in_cash:
      row: 130
      label: Net changes in cash
      evidence: Model!A130
      tie: Model row 130 equals rows 114 + 120 + 127 + 129.
    cash_year_end:
      row: 133
      label: Cash - year end
      evidence: Model!A133
      tie: Model row 133 equals Model rows 132 + 130.
    fcff:
      row: 137
      label: Free cash flow to firm
