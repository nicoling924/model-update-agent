# Machine-readable model anatomy. Auto-generated by `run.py discover`, then
# reviewed by the analyst. The engine refuses to update while `draft: true`.
draft: true
# key_numbers: optional explicit anchors for Objective 2 (auto-located by label
# scan when absent — check the run log's "key numbers" line and pin any misses):
#   sales:        {sheet: Final, row: 7}
#   net_profit:   {sheet: Final, row: 27}
#   cash:         {sheet: Final, row: 60}
#   equity:       {sheet: Final, row: 95}
model_file: null            # e.g. MyCo Model.xlsx (in model/)
units: null                 # e.g. "HK$ millions"
currency: null
fiscal_year_end: null       # e.g. 31 Dec

sheets: {}                  # name -> {role: statements|drivers|segment|valuation|untouched}
year_axis: {}               # sheet -> {header_row: 2, columns: {"2024": "AH", "2025": "AI"},
                            #           last_actual: "2024", header_type: number|text}
statement_rows: {}          # canonical_key -> {sheet, row, label_seen}
check_rows: []              # [{sheet, row, expect: 0, note}]
input_vs_formula: {}        # sheet -> {input_rows: [], formula_rows: []}
roll_forward_bases: []      # [{sheet, cell, what, re_anchor_rule}]
calc_mode: null             # manual | automatic (restore designed mode on delivery)
quirks: []                  # free-text landmines, one per line

aliases: {}                 # per-company label aliases discovered over runs
backout_rules: []           # [{row_ref, method}] — formulas, never opaque hardcodes
analyst_rulings: []         # cell-level decisions that override defaults, with why
carried_flags: []           # flags awaiting true-up from a detailed report
tie_out_anchors: []         # [{name, sheet, cell, source}] — must match disclosure exactly
